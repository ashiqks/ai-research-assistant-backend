[project]
name = "ai-research-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Research Assistant Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "starlette>=0.41.0"
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "httpx>=0.27.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
