[project]
name = "ai-research-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Research Assistant Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "starlette>=0.41.0",
    "pyjwt>=2.10.1",
    "cryptography>=45.0.6",
    "python-jose>=3.5.0",
    "jwcrypto>=1.5.6",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.43",
    "alembic>=1.16.4",
    "psycopg[binary]>=3.2.9",
    "faiss-cpu>=1.12.0",
    "sentence-transformers>=5.1.0",
    "numpy>=2.3.2",
    "langgraph>=0.6.6",
    "langchain-core>=0.3.74",
    "duckduckgo-search>=8.1.1",
    "trafilatura>=1.6.1",
    "lxml>=6.0.1",
    "beautifulsoup4>=4.13.5",
    "weasyprint>=66.0",
    "reportlab>=4.4.3",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "httpx>=0.27.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
